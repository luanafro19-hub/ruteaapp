<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf9ff" />
  <title>RUTEA · Viajes económicos por Perú</title>
  <style>
    :root {
      --ink: #152a72;
      --ink-strong: #0c287c;
      --blue: #173dbd;
      --blue-dark: #0c287c;
      --blue-light: #2b56e8;
      --lime: #b9f500;
      --lime-soft: #e4ffa1;
      --paper: #fbf9ff;
      --lavender: #eeecff;
      --lavender-2: #e5e3fb;
      --muted: #686b7d;
      --line: #d8d6e2;
      --white: #fff;
      --shadow: 0 12px 30px rgba(31, 35, 99, .10);
      --shadow-sm: 0 4px 14px rgba(31, 35, 99, .06);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: #e6e2ec; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #e6e2ec;
      color: #20223c;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(23, 61, 189, .35); outline-offset: 3px; }

    .app-shell {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
      background: var(--paper);
      box-shadow: 0 0 40px rgba(20, 20, 65, .14);
    }
    .screen { padding: 20px 16px 106px; min-height: 100vh; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      text-decoration: none;
    }
    .brand-logo-img {
      height: 38px;
      width: auto;
      object-fit: contain;
      display: block;
      transition: transform .15s ease;
    }
    .brand-logo-img:hover { transform: scale(1.03); }

    .top-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn { width: 40px; height: 40px; border-radius: 14px; background: transparent; color: var(--ink-strong); font-size: 21px; display: grid; place-items: center; position: relative; }
    .icon-btn:hover { background: var(--lavender); }
    .notification-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); position: absolute; top: 5px; right: 7px; border: 2px solid var(--paper); }
    
    /* MASCOT RUTI AVATAR BUTTON */
    .ruti-avatar-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      padding: 0;
      background: var(--blue-dark);
      border: 2.5px solid var(--lime);
      box-shadow: 0 4px 12px rgba(10, 35, 120, .22);
      overflow: hidden;
      cursor: pointer;
      transition: transform .2s cubic-bezier(0.16, 1, 0.3, 1);
      display: grid;
      place-items: center;
    }
    .ruti-avatar-btn:hover { transform: scale(1.08); }
    .ruti-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-greeting h1 { margin: 0; color: var(--ink-strong); font-size: 24px; letter-spacing: -1px; line-height: 1.1; }
    .hero-greeting p { margin: 7px 0 18px; font-size: 13px; color: var(--muted); }

    .budget-card { background: linear-gradient(145deg, #1536b5 0%, #102a84 75%); color: white; border-radius: var(--radius-xl); padding: 19px 16px 16px; box-shadow: 0 14px 26px rgba(15, 49, 171, .22); }
    .eyebrow { text-transform: uppercase; letter-spacing: 1.2px; font-size: 11px; font-weight: 800; opacity: .85; display: flex; align-items: center; gap: 6px; }
    .budget-value-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 4px 0 13px; }
    .budget-number { font-size: 34px; line-height: 1; font-weight: 900; letter-spacing: -2px; }
    .budget-number span { color: var(--lime); font-size: 21px; letter-spacing: -.5px; margin-right: 5px; }
    .circle-control { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; font-weight: 800; background: rgba(255,255,255,.12); color: #fff; }
    .circle-control.plus { background: var(--lime); color: #0e2c8c; }
    .budget-range { appearance: none; width: 100%; height: 8px; background: linear-gradient(90deg, var(--lime) 0 22%, rgba(255,255,255,.10) 22%); border-radius: 20px; outline: none; }
    .budget-range::-webkit-slider-thumb { appearance: none; width: 23px; height: 23px; border-radius: 50%; background: var(--lime); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
    .budget-range::-moz-range-thumb { width: 19px; height: 19px; border-radius: 50%; background: var(--lime); border: 3px solid #fff; }
    .range-labels { display: flex; justify-content: space-between; margin: 8px 0 18px; font-size: 10px; opacity: .85; }
    .date-select { width: 100%; padding: 12px 14px; border: 1px solid rgba(255,255,255,.15); border-radius: 19px; background: rgba(255,255,255,.08); color: white; font-weight: 700; appearance: none; }
    .date-select option { color: #1f2544; }
    .trip-types { display: flex; gap: 8px; margin-top: 13px; overflow-x: auto; scrollbar-width: none; }
    .trip-types::-webkit-scrollbar, .chips::-webkit-scrollbar, .route-scroller::-webkit-scrollbar, .sight-scroller::-webkit-scrollbar { display: none; }
    .type-chip { flex: 0 0 auto; padding: 8px 13px; border-radius: 999px; background: transparent; color: #fff; font-size: 11px; font-weight: 700; opacity: .82; }
    .type-chip.active { background: var(--lime); color: #15348e; opacity: 1; }

    .promo { margin: 18px 0 23px; display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 20px; background: var(--lavender); color: var(--ink-strong); }
    .promo-icon { width: 38px; height: 38px; border-radius: 50%; background: var(--lime); display: grid; place-items: center; font-size: 21px; flex: 0 0 auto; }
    .promo-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--lime); object-fit: cover; flex: 0 0 40px; }
    .promo-copy { flex: 1; min-width: 0; }
    .promo-copy strong { display: block; font-size: 13px; }
    .promo-copy span { display: block; font-size: 12px; color: #454967; margin-top: 2px; }
    .promo-arrow { font-size: 22px; color: var(--ink-strong); }

    .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 12px; }
    .section-head h2 { color: var(--ink-strong); margin: 0; font-size: 17px; letter-spacing: -.5px; display: flex; align-items: center; gap: 6px; }
    .section-head .count-pill { background: var(--lavender); color: var(--blue); font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 800; }
    .text-btn { color: var(--blue); font-weight: 800; font-size: 12px; background: transparent; }

    /* Route cards with REAL PHOTOS */
    .route-scroller { display: flex; gap: 12px; overflow-x: auto; padding: 0 1px 8px; scrollbar-width: none; }
    .route-card { flex: 0 0 190px; background: var(--white); border-radius: 22px; overflow: hidden; box-shadow: 0 6px 18px rgba(40, 38, 100, .07); border: 1px solid rgba(32, 34, 77, .06); transition: transform .2s ease, box-shadow .2s ease; cursor: pointer; }
    .route-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(40, 38, 100, .12); }
    
    .route-visual {
      height: 136px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      color: white;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .route-visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(6, 17, 56, .22) 0%, rgba(6, 17, 56, .15) 40%, rgba(6, 17, 56, .82) 100%);
      z-index: 1;
    }
    .route-visual > * { position: relative; z-index: 2; }
    
    .route-visual-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
    .price-badge { background: var(--lime); color: #123490; border-radius: 999px; padding: 5px 8px; font-weight: 900; font-size: 11px; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
    .photo-pill { background: rgba(12, 40, 124, .85); backdrop-filter: blur(4px); color: #fff; font-size: 10px; font-weight: 800; border-radius: 999px; padding: 4px 7px; display: inline-flex; align-items: center; gap: 3px; border: 1px solid rgba(255,255,255,.25); }
    .route-visual-bottom h3 { margin: 0; font-size: 16px; font-weight: 900; letter-spacing: -.4px; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
    .route-visual-bottom span { font-size: 10px; opacity: .9; text-shadow: 0 1px 2px rgba(0,0,0,.5); }

    .route-card-body { padding: 10px 12px 12px; }
    .route-meta { display: flex; justify-content: space-between; gap: 4px; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
    .route-meta b { color: #d48300; font-weight: 800; }
    .route-features-preview { font-size: 10px; color: #434767; background: var(--lavender); padding: 5px 8px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }

    /* Wide Route for Explore Page */
    .page-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 17px; }
    .page-title h1 { color: var(--ink-strong); font-size: 25px; letter-spacing: -1px; margin: 0; }
    .page-title p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 16px; }
    .filter-chip { border: 1px solid var(--line); background: var(--white); color: var(--ink-strong); padding: 9px 13px; border-radius: 999px; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .filter-chip.active { background: var(--lime); border-color: var(--lime); }
    .route-list { display: grid; gap: 14px; }
    
    .wide-route { background: white; border-radius: 22px; padding: 10px; display: flex; gap: 12px; box-shadow: 0 6px 18px rgba(40, 38, 100, .07); border: 1px solid rgba(32, 34, 77, .05); }
    .wide-route-visual {
      width: 124px;
      height: 124px;
      border-radius: 17px;
      flex: 0 0 auto;
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px;
      color: white;
    }
    .wide-route-visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(4, 19, 72, .15) 0%, rgba(4, 19, 72, .75) 100%);
      z-index: 1;
    }
    .wide-route-visual > * { position: relative; z-index: 2; }
    .wide-route-body { padding: 4px 4px 4px 0; min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .wide-route-body h3 { margin: 0; color: var(--ink-strong); font-size: 16px; font-weight: 900; }
    .wide-route-body p { color: var(--muted); font-size: 11px; line-height: 1.35; margin: 4px 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sights-pill-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .sight-mini-pill { font-size: 9px; font-weight: 800; color: #1b3da3; background: #eeecff; padding: 3px 6px; border-radius: 6px; }
    .verify { color: #246b48; background: #eaffea; border-radius: 999px; font-size: 9px; font-weight: 800; padding: 4px 8px; display: inline-flex; gap: 3px; align-items: center; width: fit-content; }
    .card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
    .card-bottom strong { color: var(--ink-strong); font-size: 17px; font-weight: 900; }
    .small-action { border-radius: 12px; padding: 8px 12px; color: var(--ink-strong); background: var(--lime); font-size: 11px; font-weight: 900; transition: transform .15s; }
    .small-action:hover { transform: scale(1.03); }

    /* Sights Horizontal Carousel (Home page) */
    .sight-scroller { display: flex; gap: 12px; overflow-x: auto; padding: 2px 1px 12px; scrollbar-width: none; }
    .sight-strip-card {
      flex: 0 0 210px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(20,24,60,.06);
      cursor: pointer;
      transition: transform .2s ease;
    }
    .sight-strip-card:hover { transform: translateY(-3px); }
    .sight-strip-img-wrap {
      height: 120px;
      position: relative;
      overflow: hidden;
      background: #dfdbe8;
    }
    .sight-strip-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s ease;
    }
    .sight-strip-card:hover .sight-strip-img { transform: scale(1.05); }
    .sight-strip-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(12, 40, 124, .92);
      color: var(--lime);
      font-size: 9px;
      font-weight: 900;
      padding: 4px 7px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }
    .sight-strip-body { padding: 10px 11px 11px; }
    .sight-strip-dest { font-size: 10px; font-weight: 800; color: var(--blue); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
    .sight-strip-title { font-size: 13px; font-weight: 900; color: var(--ink-strong); line-height: 1.25; margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sight-strip-loc { font-size: 10px; color: var(--muted); }

    /* Bus, Trips, Profile */
    .bus-card { background: white; border-radius: 22px; padding: 15px; box-shadow: 0 6px 18px rgba(40,38,100,.07); }
    .bus-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .bus-brand { display: flex; align-items: center; gap: 10px; color: var(--ink-strong); font-weight: 900; }
    .bus-logo { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; color: white; font-weight: 900; background: linear-gradient(135deg, #ef8354, #bd4e46); }
    .bus-logo.blue { background: linear-gradient(135deg, #4269d4, #16268e); }
    .bus-card small { color: var(--muted); font-size: 10px; }
    .bus-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 13px; border-top: 1px solid #f0eef4; }
    .bus-row strong { color: var(--ink-strong); font-size: 18px; }
    .rating { color: #d98a00; font-size: 11px; font-weight: 800; }

    .empty-card, .profile-card, .pass-preview { background: white; border-radius: 24px; padding: 21px; box-shadow: 0 6px 18px rgba(40,38,100,.07); text-align: center; }
    .empty-card h2 { color: var(--ink-strong); margin: 0; font-size: 18px; }
    .empty-card p { color: var(--muted); line-height: 1.45; font-size: 12px; margin: 8px auto 15px; max-width: 280px; }
    .primary-btn { min-height: 48px; padding: 13px 19px; color: white; background: var(--blue); border-radius: 999px; font-weight: 900; box-shadow: 0 9px 15px rgba(23,61,189,.18); font-size: 14px; }
    .primary-btn.lime { background: var(--lime); color: #123490; box-shadow: 0 6px 16px rgba(185, 245, 0, .35); }
    .primary-btn.block { width: 100%; }
    
    /* PROFILE CARD WITH LLAMA AVATAR */
    .profile-card { display: flex; align-items: center; gap: 14px; text-align: left; margin-bottom: 14px; }
    .profile-avatar-wrap {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--lime);
      box-shadow: 0 4px 14px rgba(10,35,120,.18);
      flex: 0 0 58px;
      background: var(--blue-dark);
    }
    .profile-avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .profile-card h2 { margin: 0; color: var(--ink-strong); font-size: 17px; }
    .profile-card p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }

    .settings-list { overflow: hidden; background: white; border-radius: 21px; box-shadow: 0 6px 18px rgba(40,38,100,.07); }
    .setting-row { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid #f1eff6; color: #333650; }
    .setting-row:last-child { border-bottom: 0; }
    .setting-icon { width: 32px; height: 32px; border-radius: 11px; background: var(--lavender); display: grid; place-items: center; }
    .setting-row span:nth-child(2) { flex: 1; font-size: 13px; font-weight: 700; }
    .setting-arrow { color: #aaaabd; }

    /* Nav & FAB (MASCOT BUTTON) */
    .bottom-nav { position: fixed; z-index: 10; bottom: 0; width: min(100%, 430px); display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 10px 10px max(10px, env(safe-area-inset-bottom)); background: rgba(255,255,255,.96); box-shadow: 0 -7px 18px rgba(40,38,100,.08); border-radius: 27px 27px 0 0; backdrop-filter: blur(12px); }
    .nav-item { min-height: 48px; background: transparent; color: #74778d; display: grid; place-items: center; gap: 2px; border-radius: 17px; font-size: 10px; font-weight: 800; }
    .nav-item .nav-icon { font-size: 19px; line-height: 1; }
    .nav-item.active { background: var(--lime); color: var(--ink-strong); }
    
    .fab {
      position: fixed;
      right: max(18px, calc((100vw - 430px) / 2 + 18px));
      bottom: 92px;
      z-index: 9;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--ink-strong);
      border: 3px solid var(--lime);
      box-shadow: 0 10px 24px rgba(10, 31, 108, .35);
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      transition: transform .2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .2s ease;
      display: grid;
      place-items: center;
    }
    .fab:hover {
      transform: scale(1.1);
      box-shadow: 0 14px 28px rgba(10, 31, 108, .45);
    }
    .fab-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Modals */
    .modal-backdrop { position: fixed; z-index: 20; inset: 0; background: rgba(8, 17, 65, .52); display: grid; align-items: end; justify-content: center; backdrop-filter: blur(3px); }
    .modal { width: min(100vw, 430px); max-height: 90vh; overflow-y: auto; background: var(--paper); border-radius: 29px 29px 0 0; padding: 20px 16px 30px; animation: rise .22s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes rise { from { transform: translateY(30px); opacity: .4; } to { transform: translateY(0); opacity: 1; } }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .modal-head h2 { color: var(--ink-strong); margin: 0; font-size: 20px; font-weight: 900; }
    .close-btn { width: 34px; height: 34px; background: var(--lavender); border-radius: 50%; color: var(--ink-strong); font-size: 18px; display: grid; place-items: center; }

    /* DETAIL MODAL WITH REAL PHOTO HERO */
    .detail-visual {
      height: 210px;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      position: relative;
      color: #fff;
      margin-bottom: 14px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .detail-visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(4, 19, 72, .3) 0%, rgba(4, 19, 72, .15) 30%, rgba(4, 19, 72, .88) 100%);
      z-index: 1;
    }
    .detail-visual > * { position: relative; z-index: 2; }
    .detail-visual-top { display: flex; justify-content: space-between; align-items: center; }
    .verified-photo-pill { background: rgba(185, 245, 0, .95); color: #0c287c; font-size: 11px; font-weight: 900; padding: 5px 10px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
    .detail-visual-bottom h3 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -.6px; text-shadow: 0 2px 4px rgba(0,0,0,.5); }
    .detail-visual-bottom p { margin: 4px 0 0; font-size: 12px; opacity: .95; text-shadow: 0 1px 3px rgba(0,0,0,.5); }

    .detail-copy { color: #434767; font-size: 13px; line-height: 1.5; margin: 10px 0 14px; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 14px 0; }
    .info-box { background: white; border-radius: 16px; padding: 12px; border: 1px solid rgba(20,24,60,.05); }
    .info-box small { display: block; color: var(--muted); font-size: 10px; }
    .info-box strong { display: block; color: var(--ink-strong); font-size: 15px; margin-top: 4px; }

    /* REAL SIGHTS SECTION (LUGARES PARA VER) */
    .sights-section {
      background: #f2f0fc;
      border-radius: 24px;
      padding: 16px 14px;
      margin: 18px 0;
      border: 1px solid rgba(23,61,189,.12);
    }
    .sights-head { margin-bottom: 14px; }
    .sights-head-pill { display: inline-flex; align-items: center; gap: 5px; background: var(--ink-strong); color: var(--lime); font-size: 10px; font-weight: 900; padding: 4px 9px; border-radius: 999px; margin-bottom: 6px; letter-spacing: .4px; }
    .sights-head h2 { color: var(--ink-strong); font-size: 18px; margin: 0; font-weight: 900; letter-spacing: -.4px; }
    .sights-head p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    
    .sights-list { display: grid; gap: 14px; }
    .sight-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(25, 30, 90, .07);
      border: 1px solid rgba(20, 24, 70, .05);
      transition: transform .2s ease;
      cursor: pointer;
    }
    .sight-card:hover { transform: translateY(-2px); }
    
    .sight-img-container {
      height: 180px;

    .toast { position: fixed; z-index: 40; left: 50%; bottom: 87px; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 36px); padding: 12px 15px; border-radius: 14px; background: #161936; color: white; font-size: 12px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
    .toast.show { opacity: 1; transform: translate(-50%, -5px); }

    @media (min-width: 600px) {

                <article class="sight-card" data-action="lightbox" data-route="${route.id}" data-sight="${sight.id}">
                  <div class="sight-img-container">
                    <img class="sight-photo" src="${sight.image}" onerror="this.onerror=null; this.src='${sight.fallback}'" alt="${sight.title}" loading="lazy" />
                    <span class="sight-badge ${sight.tagType}">${sight.badge}</span>
                    <span class="sight-zoom-hint">🔍 Ampliar foto</span>
                  </div>
                  <div class="sight-card-body">
                    <div class="sight-title-row">
                      <h4>${sight.title}</h4>
                      <span class="sight-location">📍 ${sight.location}</span>
                    </div>
                    <p class="sight-text">${sight.description}</p>
                    <div class="sight-tip-box">
                      <b>💡 Tip de viaje:</b> ${sight.tip}
                    </div>
                  </div>
                </article>
              `).join('')}
            </div>
          </div>

          <!-- ACTIVIDADES INCLUIDAS -->
          <div class="section-head" style="margin-top:16px">
            <h2>Qué incluye tu experiencia</h2>
          </div>
          <div class="chips" style="flex-wrap:wrap">
            ${route.activities.map(activity => `<span class="filter-chip active">✓ ${activity}</span>`).join('')}
          </div>

          <!-- DESGLOSE TARIFA BLINDADA -->
          <div class="cost-box">
            <div class="cost-line">
              <span>Transporte ida y vuelta (${route.bus})</span>
              <b>${money(75)}</b>
            </div>
            <div class="cost-line">
              <span>Alojamiento campestre / anfitrión</span>
              <b>${money(60)}</b>
            </div>
            <div class="cost-line">
              <span>Entradas y experiencias en los lugares</span>
              <b>${money(route.price - 135)}</b>
            </div>
            <div class="cost-line total">
              <span>Costo total cerrado</span>
              <strong>${money(route.price)}</strong>
            </div>
          </div>

          <div class="host-box">
            <img src="assets/ruti-avatar.png" alt="Ruti" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--lime);flex:0 0 36px;" />
            <span>
              <b>Sello Anfitrión Seguro RUTEA</b><br>
              Familia verificada en destino · baño privado · Wi-Fi · anfitrión te recibe en el terminal.
            </span>
          </div>

          <button class="primary-btn lime block" data-action="checkout" data-route="${route.id}">
            Reservar RUTA a ${route.name} · ${money(route.price)}
          </button>
        </section>
      </div>`;
    }

    /* LIGHTBOX PARA VER FOTO REAL EN TAMAÑO COMPLETO */
    function lightboxModal(sight, route) {
      return `<div class="lightbox-modal" data-action="close-lightbox">
        <div class="lightbox-container" data-stop-close="true" role="dialog" aria-modal="true">
          <div class="lightbox-img-wrap">
            <button class="lightbox-close" data-action="close-lightbox" aria-label="Cerrar">×</button>
            <span class="lightbox-badge">${sight.badge}</span>
            <img class="lightbox-img" src="${sight.image}" onerror="this.onerror=null; this.src='${sight.fallback}'" alt="${sight.title}" />
          </div>
          <div class="lightbox-content">
            <div class="lightbox-dest">${route.name} · ${route.department}</div>
            <h3 class="lightbox-title">${sight.title}</h3>
            <div class="lightbox-loc">📍 ${sight.location}</div>
            <p class="lightbox-desc">${sight.description}</p>
            <div class="lightbox-tip">
              <strong>💡 Consejo de Ruti:</strong> ${sight.tip}
            </div>
            <div class="lightbox-actions">
              <button class="primary-btn lime block" data-action="close-lightbox-and-detail" data-route="${route.id}">
                Ver ruta a ${route.name}
              </button>
            </div>
          </div>
        </div>
      </div>`;
    }

    function checkoutModal(route) {
      const options = [
        ['Yape', 'YP', ''],
        ['Plin', 'PL', 'plin'],
        ['Tarjeta Débito/Crédito', '▣', 'card']
      ];
      return `<div class="modal-backdrop" data-action="close-modal">
        <section class="modal" role="dialog" aria-modal="true" data-stop-close="true">
          <div class="modal-head">
            <h2>Confirma tu RUTA</h2>
            <button class="close-btn" data-action="close-modal">×</button>
          </div>
          <div class="promo" style="margin:0 0 15px">
            <div class="promo-icon">✓</div>
            <div class="promo-copy">
              <strong>${route.name} · Costo cerrado</strong>
              <span>Transporte + hospedaje + ${route.sights ? route.sights.length : 3} lugares turísticos</span>
            </div>
            <b style="color:var(--ink-strong)">${money(route.price)}</b>
          </div>
          <p class="muted-note">Elige tu método de pago preferido. El pase digital con código QR se genera de inmediato.</p>
          <div class="pay-options">
            ${options.map(([name, short, cls]) => `
              <label class="pay-option ${state.payment === name ? 'selected' : ''}">
                <input type="radio" name="payment" value="${name}" ${state.payment === name ? 'checked' : ''}>
                <span class="pay-logo ${cls}">${short}</span>
                <span>${name}</span>
              </label>
            `).join('')}
          </div>
          <div class="cost-box" style="margin-top:12px">
            <div class="cost-line">
              <span>Total a pagar</span>
              <strong>${money(route.price)}</strong>
            </div>
          </div>
          <button class="primary-btn lime block" data-action="pay" data-route="${route.id}">
            Confirmar pago seguro con ${state.payment}
          </button>
          <p class="muted-note" style="text-align:center;margin-top:10px;margin-bottom:0">🔒 Tarifa blindada sin cobros ocultos.</p>
        </section>
      </div>`;
    }

    function passModal() {
      const r = state.selectedRoute ? routeById(state.selectedRoute) : routes[0];
      return `<div class="modal-backdrop" data-action="close-modal">
        <section class="modal" role="dialog" aria-modal="true" data-stop-close="true">
          <div class="modal-head">
            <h2>Pase digital de viaje</h2>
            <button class="close-btn" data-action="close-modal">×</button>
          </div>
          <div class="ticket">
            <div class="ticket-top">
              <img src="assets/rutea-logo.png" alt="RUTEA" style="height:34px;filter:brightness(0) invert(1);" />
              <p>Tu paquete a ${r.name} está confirmado. ¡A disfrutar!</p>
            </div>
            <div class="ticket-main">
              <div class="success-pill">✓ Pagado con ${state.payment}</div>
              <div class="qr" aria-label="Código QR simulado"></div>
              <div class="ticket-route">
                <strong>${r.name}</strong>
                <p>${state.date} · Lima → ${r.name}</p>
              </div>
              <div class="ticket-detail">
                <div><span>Pasajero</span><b>Sebastián Rojas</b></div>
                <div><span>Transporte</span><b>${r.bus}</b></div>
                <div><span>Código</span><b>RT-8842</b></div>
                <div><span>Lugares incluidos</span><b>${r.sights ? r.sights.length : 3} atractivos</b></div>
              </div>
            </div>
          </div>
          <div class="host-box" style="margin-top:14px">
            <img src="assets/ruti-avatar.png" alt="Ruti" style="width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--lime);flex:0 0 34px;" />
            <span>
              <b>Tip de Ruti</b><br>
              Llega 20 minutos antes al punto de partida y guarda una captura de este QR por si te quedas sin señal en el valle.
            </span>
          </div>
          <button class="primary-btn lime block" data-action="save-pass">Descargar PDF / Guardar en Wallet</button>
        </section>
      </div>`;
    }

    /* CHAT CON RUTI LA LLAMA */
    function chatModal() {
      const quick = [
        '¿Cómo es el canotaje en Lunahuaná?',
        '¿Qué lugares ver en Lunahuaná?',
        'Tengo S/ 200, ¿a dónde voy?',
        '¿Cómo funciona la tarifa blindada?'
      ];
      return `<div class="modal-backdrop" data-action="close-modal">
        <section class="modal" role="dialog" aria-modal="true" data-stop-close="true">
          <div class="chat-head">
            <div class="chat-avatar-wrap">
              <img src="assets/ruti-avatar.png" alt="Ruti" class="chat-avatar-img" />
              <span class="online-indicator"></span>
            </div>
            <div>
              <h2 style="margin:0">Ruti la llama</h2>
              <p>Tu pata mochilera experta en rutas de Perú</p>
            </div>
            <button class="close-btn" style="margin-left:auto;background:rgba(255,255,255,.14);color:white" data-action="close-modal">×</button>
          </div>
          <div class="chat-feed" id="chat-feed">
            ${state.chat.map(m => `<div class="bubble ${m.from === 'ruti' ? 'ruti' : 'me'}">${m.text}</div>`).join('')}
          </div>
          <div class="quick-replies">
            ${quick.map(text => `<button class="quick-chip" data-action="chat-message" data-message="${text}">${text}</button>`).join('')}
          </div>
          <form class="chat-input-row" id="chat-form">
            <input class="chat-input" id="chat-input" placeholder="Pregúntale a Ruti sobre Lunahuaná, canotaje..." autocomplete="off" />
            <button class="send-btn" aria-label="Enviar">➤</button>
          </form>
        </section>
      </div>`;
    }

    function renderModal() {
      if (!state.modal) {
        modalRoot.innerHTML = '';
        return;
      }
      if (state.modal === 'detail') modalRoot.innerHTML = detailModal(routeById(state.selectedRoute));
      if (state.modal === 'checkout') modalRoot.innerHTML = checkoutModal(routeById(state.selectedRoute));
      if (state.modal === 'pass') modalRoot.innerHTML = passModal();
      if (state.modal === 'chat') modalRoot.innerHTML = chatModal();
    }

    function renderLightbox() {
      if (!state.lightboxSight) {
        lightboxRoot.innerHTML = '';
        return;
      }
      const r = routeById(state.lightboxSight.routeId);
      lightboxRoot.innerHTML = lightboxModal(state.lightboxSight, r);
    }

    function render() {
      app.innerHTML = state.page === 'home' ? homePage() :
                      state.page === 'explore' ? explorePage() :
                      state.page === 'bus' ? busPage() :
                      state.page === 'trips' ? tripsPage() :
                      profilePage();
      renderModal();
      renderLightbox();
    }

    function toast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(window.__ruteaToast);
      window.__ruteaToast = setTimeout(() => toastEl.classList.remove('show'), 2600);
    }

    function respondTo(text) {
      const normalized = text.toLowerCase();
      let reply = '¡Buena pregunta! En cada ruta puedes tocar "Ver lugares" para ver fotos reales, precios y detalles de visita.';
      
      if (normalized.includes('canotaje') || normalized.includes('río') || normalized.includes('rio')) {
        reply = '¡El canotaje en Lunahuaná es la aventura reina del río Cañete! 🛶 Navegas por rápidos clase II y III entre las montañas áridas y el valle soleado. Tu paquete RUTEA incluye el equipo reglamentario (chaleco salvavidas, casco, remo) y un guía profesional local certificado.';
      } else if (normalized.includes('lunahuaná') || normalized.includes('lunahuana')) {
        reply = '¡Lunahuaná es un golazo! 🛶 Tienes sol asegurado todo el año. Los lugares imperdibles que incluye tu paquete son: 1) Canotaje real en el río Cañete, 2) Puente Colgante de Catapalla, 3) Plaza colonial e Iglesia Matriz, 4) Fortaleza inca de Incahuasi, y 5) Visita a bodegas con cata de pisco y uvina. ¡Todo por S/ 180!';
      } else if (normalized.includes('200')) {
        reply = 'Con S/ 200 tienes dos opciones fijas dentro de presupuesto: 1) Lunahuaná (S/ 180, te sobran S/ 20) y 2) Canta y Obrajillo (S/ 165, te sobran S/ 35). Ambas con fotos reales y tarifa blindada.';
      } else if (normalized.includes('blindada')) {
        reply = 'La tarifa blindada es la garantía RUTEA: el precio que ves es exactamente lo que pagas por transporte ida y vuelta, hospedaje y las experiencias. Cero cobros sorpresa en el camino.';
      } else if (normalized.includes('sello') || normalized.includes('anfitrión') || normalized.includes('anfitrion')) {
        reply = 'El Sello Anfitrión Seguro garantiza que la familia hospedadora fue inspeccionada en persona: baño privado, habitación limpia, Wi-Fi y contacto telefónico directo.';
      } else if (normalized.includes('qr') || normalized.includes('pase')) {
        reply = 'Tu código QR funciona como boleto de bus y check-in con tu anfitrión. Lo puedes guardar como PDF o tomarle captura desde la sección "Mis rutas".';
      }

      state.chat.push({ from: 'me', text }, { from: 'ruti', text: reply });
      renderModal();
      setTimeout(() => {
        const feed = document.getElementById('chat-feed');
        if (feed) feed.scrollTop = feed.scrollHeight;
      }, 50);
    }

    document.addEventListener('click', event => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;

      if (action === 'page') {
        state.page = target.dataset.page;
        state.modal = null;
        state.lightboxSight = null;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      if (action === 'budget-step') {
        state.budget = Math.max(150, Math.min(350, state.budget + Number(target.dataset.step)));
        render();
      }
      if (action === 'trip-type') {
        state.tripType = target.dataset.value;
        render();
      }
      if (action === 'detail') {
        state.selectedRoute = target.dataset.route;
        state.modal = 'detail';
        state.lightboxSight = null;
        renderModal();
      }
      if (action === 'lightbox') {
        const r = routeById(target.dataset.route);
        const s = r.sights?.find(item => item.id === target.dataset.sight) || r.sights?.[0];
        if (s) {
          state.lightboxSight = { ...s, routeId: r.id };
          renderLightbox();
        }
      }
      if (action === 'close-lightbox' || (action === 'close-lightbox' && target.classList.contains('lightbox-close'))) {
        state.lightboxSight = null;
        renderLightbox();
      }
      if (action === 'close-lightbox-and-detail') {
        const routeId = target.dataset.route;
        state.lightboxSight = null;
        renderLightbox();
        state.selectedRoute = routeId;
        state.modal = 'detail';
        renderModal();
      }
      if (action === 'checkout') {
        state.selectedRoute = target.dataset.route;
        state.modal = 'checkout';
        renderModal();
      }
      if (action === 'pay') {
        state.selectedRoute = target.dataset.route;
        state.modal = 'pass';
        renderModal();
        toast('¡Pago exitoso! Tu pase digital con QR está confirmado');
      }
      if (action === 'pass') {
        state.modal = 'pass';
        renderModal();
      }
      if (action === 'chat') {
        state.modal = 'chat';
        renderModal();
        setTimeout(() => document.getElementById('chat-input')?.focus(), 50);
      }
      if (action === 'chat-message') {
        respondTo(target.dataset.message);
      }
      if (action === 'close-modal' && !target.closest('[data-stop-close]')) {
        state.modal = null;
        renderModal();
      }
      if (action === 'close-modal' && target.classList.contains('close-btn')) {
        state.modal = null;
        renderModal();
      }
      if (action === 'save-pass') {
        toast('✓ Pase digital guardado en tu dispositivo');
      }
      if (action === 'toast') {
        toast(target.dataset.message || 'Listo');
      }
    });

    document.addEventListener('input', event => {
      if (event.target.id === 'budget-range') {
        state.budget = Number(event.target.value);
        render();
      }
    });

    document.addEventListener('change', event => {
      if (event.target.id === 'date-select') {
        state.date = event.target.value;
        toast(`Fecha actualizada: ${state.date}`);
      }
      if (event.target.name === 'payment') {
        state.payment = event.target.value;
        renderModal();
      }
    });

    document.addEventListener('submit', event => {
      if (event.target.id !== 'chat-form') return;
      event.preventDefault();
      const input = document.getElementById('chat-input');
      const value = input?.value.trim();
      if (value) {
        input.value = '';
        respondTo(value);
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (state.lightboxSight) {
          state.lightboxSight = null;
          renderLightbox();
        } else if (state.modal) {
          state.modal = null;
          renderModal();
        }
      }
    });

    render();
  </script>
</body>
</html>
